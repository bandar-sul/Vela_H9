name: H9 APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-h9:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Vela_H9
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch offline-routing runtime jars
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p core/libs
          for f in osmand-java.jar osmand-shared-jvm.jar gnu-trove-osmand.jar kxml2-vela.jar; do
            curl -fSL -o "core/libs/$f" \
              "https://github.com/PimpinPumpkin/Vela/releases/download/obf-runtime/$f"
          done
          test "$(stat -c%s core/libs/osmand-java.jar)" -gt 10000000
          test "$(stat -c%s core/libs/osmand-shared-jvm.jar)" -gt 1000000
          test "$(stat -c%s core/libs/gnu-trove-osmand.jar)" -gt 100000
          test "$(stat -c%s core/libs/kxml2-vela.jar)" -gt 10000

      - name: Fetch Cronet runtime AAR
        shell: bash
        run: |
          set -euxo pipefail
          v=$(sed -n 's/^vela.cronetVersion=//p' gradle.properties)
          mkdir -p app/libs
          curl -fSL -o "app/libs/cronet-$v.aar" \
            "https://github.com/PimpinPumpkin/Vela/releases/download/cronet-runtime/cronet-$v.aar"
          test "$(stat -c%s "app/libs/cronet-$v.aar")" -gt 10000000

      - name: Fetch TTS runtime AAR
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/libs
          curl -fSL -o app/libs/sherpa-onnx-1.13.3.aar \
            "https://github.com/PimpinPumpkin/Vela/releases/download/tts-runtime/sherpa-onnx-1.13.3.aar"
          test "$(stat -c%s app/libs/sherpa-onnx-1.13.3.aar)" -gt 50000000

      - name: Validate H9 modifications
        shell: bash
        run: |
          set -euxo pipefail
          test -f app/src/main/res/values-ar/strings_01.xml
          grep -q 'name="settings_title">الإعدادات<' app/src/main/res/values-ar/strings_01.xml
          grep -q '"ar" -> ArNavStrings' core/src/main/java/app/vela/core/i18n/NavStrings.kt
          grep -q 'enableH9Fullscreen' app/src/main/java/app/vela/MainActivity.kt

      - name: Build H9 release APK
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionName="0.4.1912-H9.${{ github.run_number }}" \
            -PappVersionCode=$((29000 + ${{ github.run_number }}))

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p h9-output
          cp app/build/outputs/apk/release/*.apk h9-output/Vela_H9.apk
          ls -lh h9-output/Vela_H9.apk

      - name: Upload H9 APK
        uses: actions/upload-artifact@v4
        with:
          name: Vela_H9-APK
          path: h9-output/Vela_H9.apk
          if-no-files-found: error
          retention-days: 14


      - name: Publish stable H9 release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="h9-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          git tag -f "$TAG"
          git push origin -f "$TAG"
          gh release create "$TAG" h9-output/Vela_H9.apk \
            --title "Vela H9 Latest" \
            --notes "Latest tested H9 build from main. Build #${{ github.run_number }}."
